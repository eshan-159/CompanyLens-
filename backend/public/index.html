<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Scraper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: '#0a0a1a',
          }
        }
      }
    }
  </script>
  <style>
    .star {
      position: absolute;
      background: rgba(255, 255, 255, 0.936);
      border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-white">
  <!-- Stars Background -->
  <div id="stars" class="fixed inset-0 pointer-events-none z-0"></div>

  <!-- Main Content -->
  <div class="relative z-10 container mx-auto px-4 py-16 max-w-3xl">
    <h1 class="text-4xl md:text-5xl font-bold text-center mb-3 bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">
      Company Scraper
    </h1>
    <p class="text-center text-gray-400 mb-10">
      Upload an Excel file with company names to get their websites and descriptions
    </p>

    <div id="app"></div>
  </div>

  <script>
    // Create stars
    const stars = document.getElementById('stars');
    for (let i = 0; i < 150; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.width = star.style.height = (Math.random() * 2 + 1) + 'px';
      star.style.animationDelay = Math.random() * 2 + 's';
      star.style.animationDuration = (Math.random() * 2 + 1) + 's';
      stars.appendChild(star);
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <script type="text/babel">
    function App() {
      const [file, setFile] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState('');
      const [results, setResults] = React.useState([]);
      const [downloadUrl, setDownloadUrl] = React.useState('');
      const [dragover, setDragover] = React.useState(false);

      const handleFile = (f) => {
        if (f) {
          setFile(f);
          setError('');
          setResults([]);
        }
      };

      const onDrop = (e) => {
        e.preventDefault();
        setDragover(false);
        handleFile(e.dataTransfer.files[0]);
      };

      const onSubmit = async () => {
        if (!file) {
          setError('Please select an Excel file first');
          return;
        }
        setLoading(true);
        setError('');
        setResults([]);

        const form = new FormData();
        form.append('file', file);

        try {
          const res = await fetch('/api/upload', { method: 'POST', body: form });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed');
          setResults(data.results || []);
          if (data.downloadUrl) setDownloadUrl(data.downloadUrl);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div>
          {/* UPLOAD BOX */}
          <div
            onClick={() => document.getElementById('fileInput').click()}
            onDrop={onDrop}
            onDragOver={(e) => { e.preventDefault(); setDragover(true); }}
            onDragLeave={() => setDragover(false)}
            className={`
              border-2 border-dashed rounded-2xl p-16 text-center cursor-pointer
              transition-all duration-300 bg-white/5
              ${dragover 
                ? 'border-cyan-400 bg-cyan-400/10 scale-[1.02]' 
                : 'border-gray-600 hover:border-cyan-400 hover:bg-cyan-400/5'}
            `}
          >
            <div className="text-6xl mb-6">📁</div>
            <div className="text-xl font-medium mb-2">Click to upload or drag & drop</div>
            <div className="text-gray-500 text-sm">Supports .xlsx and .xls files</div>
            
            {file && (
              <div className="mt-6 inline-block px-5 py-3 bg-cyan-400/10 border border-cyan-400 rounded-lg text-cyan-400">
                📄 {file.name}
              </div>
            )}
            
            <input
              id="fileInput"
              type="file"
              accept=".xlsx,.xls"
              className="hidden"
              onChange={(e) => handleFile(e.target.files[0])}
            />
          </div>

          {/* SUBMIT BUTTON */}
          <button
            onClick={onSubmit}
            disabled={loading}
            className={`
              w-full max-w-xs mx-auto mt-8 block py-4 px-8 rounded-xl font-semibold text-lg
              bg-gradient-to-r from-cyan-400 to-purple-500 text-white
              transition-all duration-300
              ${loading ? 'opacity-50 cursor-not-allowed' : 'hover:-translate-y-1 hover:shadow-lg hover:shadow-cyan-400/30'}
            `}
          >
            {loading && (
              <span className="inline-block w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin mr-3 align-middle"></span>
            )}
            {loading ? 'Processing...' : 'Run Scraper'}
          </button>

          {/* ERROR */}
          {error && (
            <div className="mt-6 p-4 bg-red-500/15 border border-red-500 rounded-xl text-red-400 text-center">
              {error}
            </div>
          )}

          {/* RESULTS TABLE */}
          {results.length > 0 && (
            <div className="mt-10 bg-white/5 border border-gray-700 rounded-2xl overflow-hidden">
              <div className="flex justify-between items-center p-5 bg-white/5">
                <h2 className="text-lg font-semibold">Results</h2>
                <div className="flex items-center gap-4">
                  <span className="text-gray-400 text-sm">{results.length} companies</span>
                  {downloadUrl && (
                    <a 
                      href={downloadUrl} 
                      className="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg font-medium text-sm transition-colors"
                    >
                      ⬇️ Download Excel
                    </a>
                  )}
                </div>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full">
                  <thead>
                    <tr className="bg-black/30 text-gray-400 text-sm uppercase">
                      <th className="p-4 text-left">Company</th>
                      <th className="p-4 text-left">Website</th>
                      <th className="p-4 text-left">Description</th>
                    </tr>
                  </thead>
                  <tbody>
                    {results.map((r, i) => (
                      <tr key={i} className="border-t border-gray-800 hover:bg-white/5">
                        <td className="p-4">{r.companyName}</td>
                        <td className="p-4">
                          {r.website ? (
                            <a href={r.website} target="_blank" className="text-cyan-400 hover:underline">
                              {r.website}
                            </a>
                          ) : 'N/A'}
                        </td>
                        <td className="p-4 text-gray-300">{r.businessDescription}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
